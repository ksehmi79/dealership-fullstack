name: Dealership CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dealership_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d dealership_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_PASSWORD: postgres
      ADMIN_PASSWORD: admin123
      SALES_PASSWORD: sales123
      JWT_SECRET: ci-only-jwt-secret-key-12345678901234567890

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dealership-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: dealership-frontend
        run: npm ci

      - name: Build React frontend
        working-directory: dealership-frontend
        run: npm run build